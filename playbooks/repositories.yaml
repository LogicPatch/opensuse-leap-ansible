- name: Configure repositories
  hosts: opensuse
  become: true

  vars_files:
    - ../vars/base-system.yaml

  tasks:
    # -----------------------------------
    # Packman Repository
    # -----------------------------------
    - name: Add Packman repository
      community.general.zypper_repository:
        name: packman
        repo: "https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Leap_16.0/"
        priority: 90
        auto_import_keys: true
        state: present
      when: repositories.packman
      tags:
        - repositories
        - packman

    # -----------------------------------
    # Multimedia Codecs Repositories
    # -----------------------------------
    - name: Add multimedia repository
      community.general.zypper_repository:
        name: codecs
        repo: "https://download.opensuse.org/repositories/multimedia:/libs/16.0/"
        priority: 115
        auto_import_keys: true
        state: present
      when: repositories.codecs
      tags:
        - repositories
        - codecs
    
    # -----------------------------------
    # Videolan (libdvdcss)
    # -----------------------------------
    - name: Add VideoLAN repository (libdvdcss)
      community.general.zypper_repository:
        name: videolan
        repo: "https://download.videolan.org/pub/vlc/SuSE/16.0/"
        priority: 115
        auto_import_keys: true
        state: present
      when: repositories.codecs
      tags:
        - repositories
        - codecs

    # -----------------------------------
    # Nvidia Repository
    # -----------------------------------
    - name: Add NVIDIA repository
      community.general.zypper_repository:
        name: nvidia
        repo: "https://download.nvidia.com/opensuse/leap/16.0"
        priority: 115
        auto_import_keys: true
        state: present
      when: repositories.nvidia
      tags:
        - repositories
        - nvidia

    # -----------------------------------
    # Repository update
    # -----------------------------------
    - name: Refresh repositories
      ansible.builtin.command:
        cmd: zypper ref
      tags:
        - repositories

    # -----------------------------------
    # Remove known multimedia conflicts
    # -----------------------------------
    - name: Remove conflicting openSUSE multimedia thumbnail packages
      community.general.zypper:
        name:
          - ffmpegthumbnailer
          - libffmpegthumbnailer4
        state: absent
      when: repositories.packman
      tags:
        - repositories
        - packman

    # -----------------------------------
    # Vendor-Switch to Packman
    # -----------------------------------
    - name: Install multimedia packages from Packman
      ansible.builtin.command:
        cmd: >
          zypper --non-interactive install
          --from packman
          --allow-vendor-change
          {{ packman_multimedia_packages | join(' ') }}
      when: repositories.packman
      tags:
        - repositories
        - packman
        
    # -----------------------------------
    # Normal Package-Update
    # -----------------------------------
    - name: Update all installed packages
      community.general.zypper:
        name: '*'
        state: dist-upgrade
        update_cache: true
      tags:
        - repositories
        - packman
