---
- name: Configure Desktop & applications
  hosts: opensuse
  become: true

  vars_files:
    - ../vars/xfce.yaml
    - ../vars/desktop-common.yaml

  tasks:

    #-------------------------------------------
    # XFCE-Desktop and/or XFCE-Tools
    #-------------------------------------------
    - name: Install XFCE desktop & applications
      community.general.zypper:
        name: "{{ xfce_packages }}"
        state: present
      when: desktop.environment == "xfce"
      tags:
        - xfce          # installiert XFCE komplett inklusive LightDM
        - desktop       # installiert alles rund um den Desktop.
    
    #-------------------------------------------
    # Install GTK-Themes
    #-------------------------------------------
    - name: Install GTK themes
      community.general.zypper:
        name: "{{ themes_gtk }}"
        state: present
      when: desktop.themes_gtk
      tags:
        - themes
        - desktop

    #-------------------------------------------
    # Install Qt-Themes
    #-------------------------------------------
    - name: Install Qt themes
      community.general.zypper:
        name: "{{ themes_qt }}"
        state: present
      when: desktop.themes_qt
      tags:
        - themes
        - desktop

    #-------------------------------------------
    # Install Icon-Themes
    #-------------------------------------------
    - name: Install icon themes
      community.general.zypper:
        name: "{{ icons }}"
        state: present
      when: desktop.icons
      tags:
        - icons
        - desktop

    #-------------------------------------------
    # Install Fonts
    #-------------------------------------------
    - name: Install fonts
      community.general.zypper:
        name: "{{ fonts }}"
        state: present
      when: desktop.fonts
      tags:
        - fonts
        - desktop

    #-------------------------------------------
    # Install lightdm-Displaymanager
    #-------------------------------------------
    - name: Install desktop display manager
      community.general.zypper:
        name: "{{ desktop_displaymanager[desktop.environment].packages }}"
        state: present
      tags:
        - xfce            # installiert XFCE komplett inklusive LightDM
        - displaymanager  # installiert bzw. wechselt nur den Displaymanager
        - desktop         # installiert alles rund um den Desktop.

    #-------------------------------------------
    # Deactivate other Displaymanager
    #-------------------------------------------
    - name: Gather service facts
      ansible.builtin.service_facts:
      tags:
        - xfce            # installiert XFCE komplett inklusive LightDM
        - displaymanager  # installiert bzw. wechselt nur den Displaymanager
        - desktop         # installiert alles rund um den Desktop.
    - name: Disable other display managers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - gdm
        - lightdm
        - sddm
      when: 
        - item != desktop_displaymanager[desktop.environment].service ~ ".service"
        - item in ansible_facts.services
      tags:
        - xfce            # installiert XFCE komplett inklusive LightDM
        - displaymanager  # installiert bzw. wechselt nur den Displaymanager
        - desktop         # installiert alles rund um den Desktop.

    #-------------------------------------------
    # Remove old Displaymanager-Alias
    #-------------------------------------------
    - name: Remove existing display-manager symlink
      ansible.builtin.file:
        path: /etc/systemd/system/display-manager.service
        state: absent
      tags:
        - xfce
        - displaymanager
        - desktop

    #-------------------------------------------
    # Activate LightDM Displaymanager
    #-------------------------------------------
    - name: Enable selected display manager
      ansible.builtin.systemd:
        name: "{{ desktop_displaymanager[desktop.environment].service }}"
        enabled: true
        state: started
      tags:
        - xfce            # installiert XFCE komplett inklusive LightDM
        - displaymanager  # installiert bzw. wechselt nur den Displaymanager
        - desktop         # installiert alles rund um den Desktop.

    #-------------------------------------------
    # Install Filemanager
    #-------------------------------------------
    - name: Install selected file managers
      community.general.zypper:
        name: "{{ filemanager_packages[item.key] }}"
        state: present
      loop: "{{ filemanager | dict2items }}"
      when: item.value | bool
      tags:
        - filemanager
        - desktop
    
    #-------------------------------------------
    # Install Calendar-Application
    #-------------------------------------------
    - name: Install selected calendar applications
      community.general.zypper:
        name: "{{ calendar_packages[item.key] }}"
        state: present
      loop: "{{ calendar | dict2items }}"
      when: item.value | bool
      tags:
        - calendar
        - desktop
    
    #-------------------------------------------
    # Install Editor
    #-------------------------------------------
    - name: Install selected editors
      community.general.zypper:
        name: "{{ editor_packages[item.key] }}"
        state: present
      loop: "{{ editor | dict2items }}"
      when: item.value | bool
      tags:
        - editor
        - desktop
    
    #-------------------------------------------
    # Install Image-Viewer
    #-------------------------------------------
    - name: Install selected image viewers
      community.general.zypper:
        name: "{{ image_viewer_packages[item.key] }}"
        state: present
      loop: "{{ image_viewer | dict2items }}"
      when: item.value | bool
      tags:
        - imageviewer
        - desktop
    
    #-------------------------------------------
    # Install PDF-Reader
    #-------------------------------------------
    - name: Install selected PDF viewers
      community.general.zypper:
        name: "{{ pdf_viewer_packages[item.key] }}"
        state: present
      loop: "{{ pdf_viewer | dict2items }}"
      when: item.value | bool
      tags:
        - pdf
        - desktop
    
    #-------------------------------------------
    # Install Screenshot-Application
    #-------------------------------------------
    - name: Install selected screenshot applications
      community.general.zypper:
        name: "{{ screenshot_packages[item.key] }}"
        state: present
      loop: "{{ screenshot_tool | dict2items }}"
      when: item.value | bool
      tags:
        - screenshot
        - desktop